# ─────────────────────────────────────────────────────────────────────
# config.yaml — PolyHybrid-v4 « Tirelire Crypto »
# 
# ⚠️  IMPORTANT : Ne jamais mettre ta PRIVATE_KEY ici !
#     Elle se met dans les variables d'environnement Railway (section Sensitive).
#
# Commence toujours en DRY_RUN=true pour tester sans risque.
# ─────────────────────────────────────────────────────────────────────

# ─── Chemins ──────────────────────────────────────────────────────────
paths:
  trades_csv: /app/data/trades.csv   # Volume persistant Railway

# ─── APIs Polymarket ─────────────────────────────────────────────────
api:
  polymarket_markets:  https://gamma-api.polymarket.com/markets
  polymarket_price:    https://clob.polymarket.com/midpoint
  polymarket_order:    https://clob.polymarket.com/order
  polymarket_redeem:   https://clob.polymarket.com/redeem
  polymarket_history:  https://clob.polymarket.com/prices-history

# ─── Boucle principale ───────────────────────────────────────────────
loop:
  sleep_between_cycles_s: 30    # Dors 30s entre chaque analyse (économie CPU)
  sleep_on_pause_s:       300   # Dors 5 min quand bouclier actif

# ─── Trading ─────────────────────────────────────────────────────────
trading:
  max_markets:          10      # Max marchés simultanés (multi-bin)
  max_position_pct:     0.005   # Max 0.5% de la tirelire par trade
  default_bankroll:     1000.0  # Balance de départ (remplacée par la vraie balance au runtime)

# ─── Indicateurs (Vertical Priority) ─────────────────────────────────
indicators:
  # Porte 1 : ATR / Volatilité
  atr_period:    14
  atr_min:       0.005   # Volatilité min : 0.5%
  atr_max:       0.08    # Volatilité max : 8% (trop agité = on dort)

  # Porte 2 : Prix
  ema_fast:      9
  ema_slow:      21

  # Porte 3 : Volume
  volume_multiplier: 1.2  # Volume doit être >120% de la moyenne

  # Porte 4 : Momentum
  rsi_period:    14
  rsi_min:       40
  rsi_max:       75
  macd_fast:     12
  macd_slow:     26
  macd_signal:   9
  stoch_period:  14

  max_edge:      0.15     # Edge maximum théorique

# ─── Bouclier anti-colère ────────────────────────────────────────────
shield:
  max_daily_loss_pct: 0.03   # Pause si perte > 3% dans la journée
  pause_hours:        24     # Pause de 24h

# ─── Stratégies ──────────────────────────────────────────────────────
strategies:

  latency_sniper:
    end_time_threshold_s:    180    # Marchés < 3 min de vie
    momentum_threshold_pct:  0.005  # Momentum >0.5% en 60s (@sopersone)
    exit_prob_threshold:     0.67   # Sortie à 65-70% (@sopersone)
    exit_time_before_end_s:  15     # Sortie 15s avant la fin (@sopersone)
    max_hold_s:              120    # Max 2 min de holding
    poll_interval_s:         3      # Vérifie le prix toutes les 3s
    min_ev:                  0.01   # EV minimum pour entrer
    kelly_fraction:          0.25   # 1/4 Kelly (très conservateur)

  market_making:
    spread:       0.02    # 2% de spread
    max_hold_s:   300     # Max 5 min
    min_ev:       0.005   # EV net minimum après spread
